# Shipped by je-detection-agent itself, not relied on from another
# package's default config -- the previously-shipped config pointed at
# fluentbit's own /etc/td-agent-bit/parsers.conf, which is real on this
# distro but not something this recipe's own FILES/RDEPENDS guarantee
# the exact path/content of. Owning this file makes the config
# self-contained: a freshly built image can start Fluent Bit against
# this config without any manual local patch.
[PARSER]
    Name    json
    Format  json
