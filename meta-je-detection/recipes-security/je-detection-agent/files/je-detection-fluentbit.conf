[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File /etc/td-agent-bit/parsers.conf

# je-detection-agent's own OCSF Security Finding events (JSON lines) --
# transport only, no formatting here (that's the agent's job).
[INPUT]
    Name         tail
    Path         /var/log/je-detection/events.jsonl
    Tag          je.detection
    Parser       json
    DB           /var/lib/je-detection/fluentbit.db

[OUTPUT]
    Name              splunk
    Match             je.detection
    Host              ${JE_SPLUNK_HEC_HOST}
    Port              ${JE_SPLUNK_HEC_PORT}
    TLS               On
    TLS.Verify        Off
    Splunk_Token      ${JE_SPLUNK_HEC_TOKEN}
    Event_Sourcetype  ocsf:2001
    Event_Source      je-detection-agent
